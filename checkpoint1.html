<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カードグリッド</title>
    <style>
      :root {
        --accent-color: #2563eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: sans-serif;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        background: #f1f5f9;
      }

      .logo {
        color: var(--accent-color);
        font-weight: bold;
      }

      .header ul {
        display: flex;
        gap: 20px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .header a {
        color: #222;
        text-decoration: none;
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        padding: 20px;
      }

      .card {
        padding: 24px;
        border: 1px solid #ddd;
        border-radius: 8px;
        transition: transform 0.2s ease;
      }

      .card:hover {
        transform: translateY(-4px);
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="logo">ロゴ</div>
      <nav>
        <ul>
          <li><a href="#">ホーム</a></li>
          <li><a href="#">サービス</a></li>
          <li><a href="#">お問い合わせ</a></li>
        </ul>
      </nav>
    </header>

    <main class="card-grid">
      <article class="card">
        <h2>カード1</h2>
        <p>カードの内容です。</p>
      </article>
      <article class="card">
        <h2>カード2</h2>
        <p>カードの内容です。</p>
      </article>
      <article class="card">
        <h2>カード3</h2>
        <p>カードの内容です。</p>
      </article>
    </main>
  </body>
</html>
